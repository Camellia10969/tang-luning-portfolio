name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Build static portfolio
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$SITE_URL" ]; then
            echo 'Set the SITE_URL repository variable before publishing.'
            exit 1
          fi
          npm run build
      - name: Audit generated site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run audit
      - name: Upload static site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed portfolio
        id: deployment
        uses: actions/deploy-pages@v4
